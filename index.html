<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tajny Projekt</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- =====================================
     EKRAN HASŁA
     ===================================== -->

<main id="password-screen" class="screen">
    <div class="password-card">
        <div class="lock-icon">🔒</div>

        <h1>Tajny Projekt</h1>

        <p class="subtitle">
            Ta strona jest prywatna.
        </p>

        <form id="password-form">
            <label for="password-input">Hasło</label>

            <input
                    type="password"
                    id="password-input"
                    placeholder="Wpisz hasło"
                    autocomplete="off"
                    required
            >

            <button type="submit">WEJDŹ</button>

            <p id="password-error" class="error-message">
                Nieprawidłowe hasło.
            </p>
        </form>
    </div>
</main>


<!-- =====================================
     WŁAŚCIWA APLIKACJA
     ===================================== -->

<main id="app-screen" class="hidden">

    <!-- =================================
         EKRAN STARTOWY
         ================================= -->

    <section id="start-screen" class="app-page">
        <div class="page-content">

            <div class="start-logo">
                <div class="logo-placeholder">🎀</div>
            </div>

            <p class="eyebrow">TAJNY PROJEKT</p>

            <h1 class="start-title">Witaj ❤️</h1>

            <p class="description">
                Tutaj pojawi się krótki opis
                całej przygody.
            </p>

            <button
                    id="start-button"
                    class="primary-button"
            >
                ZACZYNAMY
            </button>

            <button
                    id="preview-button"
                    class="secondary-button preview-button"
            >
                PODGLĄD PYTAŃ
            </button>

            <button
                    id="image-quiz-test-button"
                    class="secondary-button"
            >
                TEST QUIZU OBRAZKOWEGO
            </button>

        </div>
    </section>


    <!-- =================================
         PODGLĄD PYTAŃ
         ================================= -->

    <section id="question-preview-screen" class="app-page hidden">
        <div class="page-content question-preview-content">

            <div class="preview-header">
                <p class="eyebrow">TRYB TESTOWY</p>

                <h1>Podgląd pytań</h1>

                <p class="description">
                    Wszystkie pytania znajdujące się
                    w puli poziomu 1.
                </p>
            </div>

            <div id="questions-container">
                <p class="loading-message">
                    Wczytywanie pytań...
                </p>
            </div>

            <button
                    id="preview-back-button"
                    class="secondary-button"
            >
                WRÓĆ
            </button>

        </div>
    </section>


    <!-- =================================
         QUIZ
         ================================= -->

    <section id="quiz-screen" class="app-page hidden">
        <div class="page-content quiz-content">

            <div class="quiz-header">
                <p
                        id="quiz-question-number"
                        class="eyebrow"
                >
                    PYTANIE 1 / 5
                </p>
            </div>

            <h1
                    id="quiz-question-text"
                    class="quiz-question-text"
            >
                Pytanie
            </h1>

            <img
                    id="quiz-question-image"
                    class="question-image hidden"
                    alt="Obrazek pytania"
            >

            <div
                    id="quiz-answers"
                    class="question-answers"
            ></div>

        </div>
    </section>

</main>


<!-- =====================================
     JAVASCRIPT
     ===================================== -->

<script src="js/auth.js"></script>
<script src="js/storage.js"></script>
<script src="js/question-parser.js"></script>
<script src="js/quiz.js"></script>
<script src="js/app.js"></script>

</body>
</html>
